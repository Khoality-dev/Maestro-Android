name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION_NAME="${RAW_TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret set — building unsigned release APK"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        id: build
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            TASK=":app:assembleRelease"
            VARIANT="release"
          else
            TASK=":app:assembleDebug"
            VARIANT="debug"
          fi
          ./gradlew "$TASK" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --no-daemon --stacktrace
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "app/build/outputs/apk/${{ steps.build.outputs.variant }}" -name '*.apk' ! -name '*-unsigned.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          OUT="maestro-${{ steps.version.outputs.name }}-${{ steps.build.outputs.variant }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Automated release build.

            - versionName: `${{ steps.version.outputs.name }}`
            - versionCode: `${{ steps.version.outputs.code }}`
            - variant: `${{ steps.build.outputs.variant }}`
            - signed with release keystore: `${{ steps.keystore.outputs.present }}`
